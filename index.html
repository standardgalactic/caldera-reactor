<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caldera Audioscope</title>

<style>
body{
  margin:0;
  background:#000;
  color:#7cff7c;
  font-family:monospace;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  cursor:pointer;
}

/* top controls */
.controls{
  position:fixed;
  top:10px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:16px;
  background:rgba(0,20,0,0.4);
  padding:6px 10px;
  border:1px solid rgba(0,255,0,0.3);
  border-radius:6px;
  z-index:10;
  cursor:default;
}

.controls label{
  font-size:11px;
  display:flex;
  flex-direction:column;
  align-items:center;
}

input{
  width:90px;
}

.title{
  font-size:14px;
  letter-spacing:0.2em;
  color:#00ff88;
  text-shadow:0 0 10px #00ff66;
  margin-bottom:10px;
}

canvas{
  width:min(420px,85vw);
  height:min(420px,85vw);
  border-radius:50%;
  border:2px solid rgba(0,255,0,0.5);
  background:#000;
  box-shadow:
    0 0 40px rgba(0,255,120,0.2) inset,
    0 0 18px rgba(0,255,0,0.7);
}

.subs{
  position:fixed;
  bottom:10px;
  width:min(520px,92vw);
  text-align:center;
  padding:6px 10px;
  font-size:14px;
  color:#aaffaa;
  text-shadow:0 0 6px #00ff66;
  background:rgba(0,20,0,0.35);
  border:1px solid rgba(0,255,0,0.2);
  border-radius:6px;
  pointer-events:none;
  min-height:2em;
}
</style>
</head>

<body>

<div class="controls">
  <label>
    Speed
    <input id="speed" type="range" min="0.6" max="1.4" step="0.01" value="1">
  </label>
  <label>
    Pitch
    <input id="pitch" type="range" min="-4" max="4" step="1" value="0">
  </label>
</div>

<div class="title">Caldera Reactor</div>
<canvas id="viz"></canvas>
<div id="subs" class="subs"></div>

<audio id="audio" preload="auto">
  <source src="The_Caldera_Reactor_Thinks_With_Water.mp3" type="audio/mpeg">
</audio>

<script>
const audio = document.getElementById("audio");
const subs  = document.getElementById("subs");

const speedSlider = document.getElementById("speed");
const pitchSlider = document.getElementById("pitch");

/* AUDIO */
let ctx, analyser, data;

function initAudio(){
  if(ctx) return;

  ctx = new AudioContext();
  analyser = ctx.createAnalyser();
  analyser.fftSize = 2048;
  data = new Uint8Array(analyser.fftSize);

  const node = ctx.createMediaElementSource(audio);
  node.connect(analyser);
  analyser.connect(ctx.destination);
}

/* CONTROLS */
function updatePlayback(){
  const speed = parseFloat(speedSlider.value);
  const pitch = parseFloat(pitchSlider.value);

  /* pitch simulated via rate multiplier */
  const pitchFactor = Math.pow(2, pitch / 12);

  audio.playbackRate = speed * pitchFactor;
}

speedSlider.oninput = updatePlayback;
pitchSlider.oninput = updatePlayback;

/* prevent control clicks from toggling audio */
document.querySelector(".controls").onclick = e => e.stopPropagation();

/* CLICK ANYWHERE */
document.body.onclick = async ()=>{
  initAudio();

  if(ctx.state === "suspended") await ctx.resume();

  if(audio.paused){
    await audio.play();
  } else {
    audio.pause();
  }
};

/* SUBTITLES */
let cues = [];

async function loadVTT(){
  try{
    const res = await fetch("The_Caldera_Reactor_Thinks_With_Water.vtt");
    if(!res.ok) return;

    const text = await res.text();
    const blocks = text.split(/\n{2,}/);

    for(const block of blocks){
      const lines = block.trim().split("\n");
      const ts = lines.find(l=>l.includes("-->"));
      if(!ts) continue;

      const [s,e] = ts.split("-->").map(x=>x.trim());
      const txt = lines.slice(lines.indexOf(ts)+1).join(" ");

      cues.push({
        start: parseTime(s),
        end: parseTime(e),
        text: txt
      });
    }
  }catch(e){
    console.warn("VTT error", e);
  }
}

function parseTime(t){
  const p = t.split(":");
  return p.length===3
    ? +p[0]*3600 + +p[1]*60 + +p[2]
    : +p[0]*60 + +p[1];
}

audio.ontimeupdate = ()=>{
  const t = audio.currentTime;
  const c = cues.find(c=>t>=c.start && t<c.end);
  subs.textContent = c ? c.text : "";
};

loadVTT();

/* CANVAS */
const canvas = document.getElementById("viz");
const c = canvas.getContext("2d");

const W = 320, H = 320;
canvas.width = W;
canvas.height = H;

let t = 0;
let energySmooth = 0;

function draw(){
  t++;

  c.fillStyle = "rgba(0,5,0,0.10)";
  c.fillRect(0,0,W,H);

  let buf, len;

  if(analyser){
    analyser.getByteTimeDomainData(data);
    buf = data;
    len = data.length;
  } else {
    buf = new Uint8Array(512);
    for(let i=0;i<512;i++){
      buf[i] = 128 + Math.sin(i*0.08 + t*0.02)*25;
    }
    len = 512;
  }

  let energy = 0;
  for(let i=0;i<len;i+=8){
    energy += Math.abs((buf[i]-128)/128);
  }
  energy /= (len/8);

  energySmooth += (energy - energySmooth) * 0.03;

  const lag = Math.floor(len*(0.16 + Math.sin(t*0.004)*0.06));

  const cx = W/2, cy = H/2;
  const R = W*0.42*(1 - energySmooth*0.25);

  c.beginPath();

  for(let i=0;i<len;i++){
    const x = cx + ((buf[i]-128)/128)*R;
    const y = cy + ((buf[(i+lag)%len]-128)/128)*R;

    if(i===0) c.moveTo(x,y);
    else c.lineTo(x,y);
  }

  c.strokeStyle = `rgba(120,255,140,${0.5 + energySmooth*0.5})`;
  c.lineWidth = 1.5 + energySmooth*3;
  c.shadowBlur = 20 + energySmooth*40;
  c.shadowColor = "#00ff66";

  c.stroke();
  c.shadowBlur = 0;

  requestAnimationFrame(draw);
}

draw();

</script>

</body>
</html>
